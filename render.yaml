services:
  - type: web
    name: backlinq
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: bun install && bun run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CTX_API_KEY
        sync: false
      - key: OPEN_PAGERANK_API_KEY
        sync: false
      - key: MOZ_ACCESS_ID
        sync: false
      - key: MOZ_SECRET_KEY
        sync: false
      - key: MOZ_API_TOKEN
        sync: false
